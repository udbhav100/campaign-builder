
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objective-First Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Robust Polyfills for Browser Environment
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      // Ensure NODE_ENV is set
      if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = 'production';
      }
      
      // Polyfill Buffer for libraries that might use it (safe, minimal implementation)
      if (!window.Buffer) {
        function BufferPolyfill() {}
        BufferPolyfill.isBuffer = () => false;
        BufferPolyfill.from = (data, encoding) => {
          if (typeof data === 'string') {
             const encoder = new TextEncoder();
             return encoder.encode(data);
          }
          return new Uint8Array(data || 0);
        };
        BufferPolyfill.alloc = (size) => new Uint8Array(size || 0);
        window.Buffer = BufferPolyfill;
      }
      
      window.global = window;
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
